<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Scanner Laser Beam Gradient -->
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="64" height="64" rx="15" fill="url(#bgGrad)" />

  <!-- Corner Viewfinder Brackets (Facial Bounding Box) -->
  <!-- Top-Left -->
  <path d="M14 24 V17 C14 15.34 15.34 14 17 14 H24" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
  <!-- Top-Right -->
  <path d="M40 14 H47 C48.66 14 50 15.34 50 17 V24" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
  <!-- Bottom-Left -->
  <path d="M14 40 V47 C14 48.66 15.34 50 17 50 H24" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
  <!-- Bottom-Right -->
  <path d="M40 50 H47 C48.66 50 50 48.66 50 47 V40" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />

  <!-- Center Biometric Face Silhouette -->
  <!-- Head Contour -->
  <path d="M22 28 C22 22.48 26.48 19 32 19 C37.52 19 42 22.48 42 28 C42 34 37 41 32 43 C27 41 22 34 22 28 Z" 
        stroke="#E0E7FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.95" />

  <!-- Biometric Landmark Nodes -->
  <!-- Left Eye -->
  <circle cx="27.5" cy="28" r="2" fill="#FFFFFF" />
  <!-- Right Eye -->
  <circle cx="36.5" cy="28" r="2" fill="#FFFFFF" />

  <!-- Nose -->
  <path d="M32 30 V33.5 H30.5" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Subtle Smile / Mouth -->
  <path d="M28.5 37 C30 38.5 34 38.5 35.5 37" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" />

  <!-- Horizontal Laser Scan Line with Glow -->
  <line x1="16" y1="32" x2="48" y2="32" stroke="url(#laserGrad)" stroke-width="2.5" filter="url(#glow)" />

  <!-- Verified Attendance Badge (Bottom Right Accent) -->
  <circle cx="48" cy="48" r="7" fill="#10B981" stroke="#FFFFFF" stroke-width="2" />
  <path d="M45 48 L47 50 L51 46" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
</svg>
